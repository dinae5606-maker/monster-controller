<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster BLE Test</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
      background: #f5f5f7;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
    }

    #connect {
      background: #007aff;
      color: white;
    }

    .control {
      background: #e8e8ed;
    }

    #stop {
      background: #ff3b30;
      color: white;
      font-weight: bold;
    }

    #status {
      margin: 20px 0;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Monster BLE Test</h1>

  <div id="status">未连接</div>

  <button id="connect" onclick="connectMonster()">
    连接 MonsterPub
  </button>

  <button class="control" onclick="setLevel(0x01)">
    1%
  </button>

  <button class="control" onclick="setLevel(0x0A)">
    10%
  </button>

  <button class="control" onclick="setLevel(0x14)">
    20%
  </button>

  <button id="stop" onclick="stopMonster()">
    ■ STOP
  </button>

</div>

<script>

let device;
let characteristic;

const SERVICE_UUID =
  "00006000-0000-1000-8000-00805f9b34fb";

const CHARACTERISTIC_UUID =
  "00006001-0000-1000-8000-00805f9b34fb";

async function connectMonster() {

  try {

    document.getElementById("status").innerText =
      "正在寻找设备…";

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    document.getElementById("status").innerText =
      "正在连接 " + (device.name || "BLE device") + "…";

    const server = await device.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE_UUID);

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "● 已连接：" + (device.name || "MonsterPub");

    device.addEventListener(
      "gattserverdisconnected",
      () => {
        characteristic = null;
        document.getElementById("status").innerText =
          "连接已断开";
      }
    );

  } catch (error) {

    document.getElementById("status").innerText =
      "连接失败：" + error.message;

  }
}


async function setLevel(value) {

  if (!characteristic) {
    alert("请先连接 MonsterPub");
    return;
  }

  try {

    const data = new Uint8Array([value]);

    if (characteristic.writeValueWithoutResponse) {
      await characteristic.writeValueWithoutResponse(data);
    } else {
      await characteristic.writeValue(data);
    }

    document.getElementById("status").innerText =
      "已发送：0x" +
      value.toString(16).padStart(2, "0").toUpperCase();

  } catch (error) {

    document.getElementById("status").innerText =
      "写入失败：" + error.message;

  }
}


async function stopMonster() {

  if (!characteristic) return;

  try {

    const stop = new Uint8Array([0x00]);

    if (characteristic.writeValueWithoutResponse) {
      await characteristic.writeValueWithoutResponse(stop);
    } else {
      await characteristic.writeValue(stop);
    }

    document.getElementById("status").innerText =
      "■ 已停止";

  } catch (error) {

    document.getElementById("status").innerText =
      "停止失败：" + error.message;

  }
}

</script>

</body>
</html>
